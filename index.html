요구: 첨부 이미지의 15명 + 조용한닝겐, 무작위 16강, 우승 결과, GitHub Pages.
검증표: 시작 → 16강 1/8 → 8번 선택 → 8강 → 4번 → 4강 → 2번 → 결승 → 1번 → 우승.
이전 선택 되돌리기, 재시작, 새로고침 복구, 저장 차단, 결과 링크, 좁은 화면 검증.
프로필은 원본 이미지의 해당 위치만 CSS로 표시한다. 계정 ID와 활동 수치는 화면에 사용하지 않는다.
방문자 공통 랭킹을 수집하지 않는다. 진행 기록은 현재 브라우저에만 저장한다. -->

      const wrap=node('span','avatar');wrap.setAttribute('aria-hidden','true');const ring=node('span','avatar-ring');
      if(c.quiet)ring.append(node('span','quiet-profile','🤫'));
      else{const p=node('span','profile');p.style.backgroundPosition=`-${c.x}px -${c.y}px`;ring.append(p);}
      wrap.append(ring);if(c.quiet)wrap.append(node('span','new-dot','NEW'));return wrap;
    }
    function title(text){const h=node('h1','',text);h.tabIndex=-1;return h;}
    function focusTitle(){main.querySelector('h1')?.focus({preventScroll:true});}
    function announce(text){const el=document.getElementById('toast');clearTimeout(toastTimer);el.textContent=text;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),2800);}
    function save(){try{localStorage.setItem(KEY,JSON.stringify(state));document.getElementById('storage-warning').hidden=true;}catch{document.getElementById('storage-warning').hidden=false;}}
    function load(){try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);replay(parsed);state=parsed;}}catch{state=null;document.getElementById('storage-warning').hidden=false;}}
    function shuffle(ids){const result=[...ids];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
    function roundName(n){return n===2?'결승':`${n}강`;}
    function start(){locked=false;state={version:1,topic:draftTopic,seed:shuffle(CANDIDATES.map(c=>c.id)),picks:[]};save();clearSharedHash();renderGame();focusTitle();window.scrollTo({top:0,behavior:'instant'});}
    function clearSharedHash(){if(window.location.hash.startsWith('#winner=')){try{history.replaceState(null,'',window.location.pathname+window.location.search);}catch{}}}
    function requestStart(){if(!captureTopic())return;if(state && state.picks.length>0 && !replay(state).champion){returnFocus=document.activeElement;restartDialog.showModal();}else start();}

    function renderHome(){
      screen='home';locked=false;main.replaceChildren();
      const hero=node('section','hero fade-in');const intro=node('div');
      intro.append(node('p','eyebrow','HAMZZI WORLD CUP · YOUR OWN THEME'));
      const h=title('햄찌 월드컵,');h.append(document.createElement('br'),node('span','accent','주제는 내 마음대로.'));intro.append(h);
      const description=node('p','hero-description','귀여움 대결? 함께 여행 가고 싶은 햄찌?');description.append(document.createElement('br'),document.createTextNode('주제를 정하고 16명 중 딱 한 명을 골라 보세요.'));intro.append(description);
      const field=node('label','topic-field');field.htmlFor='topic-input';field.append(node('span','','이번 월드컵의 주제'));const input=node('input','topic-input');input.id='topic-input';input.type='text';input.maxLength=60;input.value=draftTopic;input.placeholder='예: 같이 여행 가고 싶은 햄찌는?';input.setAttribute('aria-describedby','topic-hint topic-error');field.append(input);intro.append(field);const hint=node('p','topic-hint','입력한 제목이 대결과 결과 화면에 그대로 나와요.');hint.id='topic-hint';const error=node('p','topic-error','월드컵 주제를 먼저 입력해 주세요.');error.id='topic-error';error.hidden=true;intro.append(hint,error);
      const actions=node('div','hero-actions');
      const active=state && !replay(state).champion && state.picks.length>0;
      actions.append(button(active?'이어서 고르기 →':'16강 월드컵 시작 →','primary',active?'resume':'start'));
      if(active)actions.append(button('새로 시작','secondary','start'));
      if(state && replay(state).champion)actions.append(button('지난 우승 보기','secondary','last-result'));
      intro.append(actions,node('p','fine-print','조용한닝겐 합류 완료! · 무작위 대진 · 15번의 선택'));
      const art=node('div','hero-art');art.setAttribute('aria-hidden','true');
      art.innerHTML='<span class="art-star star-a">✦</span><span class="art-label label-a">귀여우면 다야? 응.</span><div class="hamster"><i class="ear left"></i><i class="ear right"></i><i class="horn left"></i><i class="horn right"></i><div class="face"></div><i class="eye left"></i><i class="eye right"></i><i class="cheek left"></i><i class="cheek right"></i><i class="nose"></i><i class="mouth"></i><i class="tooth"></i><i class="paw left"></i><i class="paw right"></i></div><span class="art-label label-b">취향 저격 주의 ♡</span><span class="art-star star-b">✦</span>';
      hero.append(intro,art);main.append(hero);
      const how=node('div','how');[['1','둘 중 더 끌리는 햄찌'],['2','16강부터 결승까지'],['3','나의 최애 탄생!']].forEach(([number,text],i)=>{if(i)how.append(node('span','arrow','→'));const s=node('span');s.append(node('b','',number),document.createTextNode(text));how.append(s);});main.append(how);
      const rosterSection=node('section','roster-section');rosterSection.id='roster';const top=node('div','section-top');top.append(node('h2','','오늘의 참가자'),node('small','','15명 + 조용한닝겐 = 16명'));rosterSection.append(top);
      const list=node('ul','roster');CANDIDATES.forEach(c=>{const li=node('li');li.append(avatar(c),node('p','roster-name',c.name));list.append(li);});rosterSection.append(list);main.append(rosterSection);
    }
    function renderGame(){
      const bracket=replay(state);if(bracket.champion){renderResult(bracket.champion,false);return;}
      screen='game';main.replaceChildren();const section=node('section','game');
      const tools=node('div','game-tools');tools.append(button('← 처음으로','text-button','home'));const pills=node('div','round-pills');[16,8,4,2].forEach(n=>pills.append(node('span',`round-pill ${bracket.current.length===n?'active':bracket.current.length<n?'done':''}`,roundName(n))));tools.append(pills);section.append(tools);
      const info=node('div','match-intro');info.append(node('p','match-count',`${roundName(bracket.current.length)} · ${bracket.position/2+1} / ${bracket.current.length/2}`),title(topicFor(state)),node('p','',bracket.current.length===2?'마지막 선택! 둘 중 한 명을 골라 주세요.':'주제에 더 어울리는 햄찌의 프로필을 눌러 주세요.'));section.append(info);
      const fight=node('div','fight fade-in');[0,1].forEach((side)=>{const c=byId.get(bracket.current[bracket.position+side]);const card=button('','contender','pick');card.dataset.id=c.id;card.setAttribute('aria-label',`${c.name} 선택`);card.append(node('p','side-label',side===0?'CHOICE 01':'CHOICE 02'),avatar(c),node('h2','',c.name),node('span','choose-label','♡  이 햄찌 선택'));fight.append(card);});const vs=node('span','vs','VS');vs.setAttribute('aria-hidden','true');fight.append(vs);section.append(fight);
      const bottom=node('div','game-bottom');const undo=button('↶ 이전 선택 되돌리기','text-button','undo');undo.disabled=state.picks.length===0;bottom.append(undo);const progress=node('div','progress-group');const track=node('div','progress-track');track.setAttribute('role','progressbar');track.setAttribute('aria-label','전체 대결 진행');track.setAttribute('aria-valuemin','0');track.setAttribute('aria-valuemax','15');track.setAttribute('aria-valuenow',String(state.picks.length));const fill=node('div','progress-fill');fill.style.width=`${state.picks.length/15*100}%`;track.append(fill);progress.append(track,node('span','progress-text',`${state.picks.length} / 15 선택`));bottom.append(progress);section.append(bottom);
      const note=node('p','keyboard-note','키보드로도 고를 수 있어요  ');note.append(node('kbd','','←'),document.createTextNode(' 왼쪽  '),node('kbd','','→'),document.createTextNode(' 오른쪽'));section.append(note);main.append(section);
    }
    function choose(id){
      if(screen!=='game'||locked)return;const bracket=replay(state);const pair=bracket.current.slice(bracket.position,bracket.position+2);if(!pair.includes(id))return;
      locked=true;main.querySelectorAll('.contender').forEach(el=>{el.disabled=true;if(el.dataset.id===id)el.classList.add('selected');});
      state.picks.push(id);save();
      setTimeout(()=>{locked=false;renderGame();focusTitle();},180);
    }
    function undo(){if(locked||!state||state.picks.length===0)return;state.picks.pop();save();clearSharedHash();renderGame();focusTitle();}
    function renderResult(winnerId,shared){
      if(shared)draftTopic=sharedTopic();
      screen='result';locked=false;main.replaceChildren();const c=byId.get(winnerId);const section=node('section','result fade-in');section.dataset.winner=winnerId;section.append(node('p','result-eyebrow',shared?'A FRIEND’S FAVORITE':'MY ONE & ONLY HAMZZI'),node('p','result-topic',shared?sharedTopic():topicFor(state)),title(shared?'친구가 고른 햄찌':'내가 고른 햄찌'),node('p','result-sub',shared?'친구의 선택이에요. 당신의 햄찌도 찾아볼까요?':'16명의 후보 중, 마지막까지 선택한 단 한 명.'));
      const card=node('div','winner-card');const crown=node('div','crown','👑');crown.setAttribute('aria-hidden','true');card.append(crown,avatar(c),node('h2','winner-name',c.name),node('p','winner-caption',shared?'친구의 이상형 월드컵 우승':'나의 햄찌 월드컵 우승'));section.append(card);
      const actions=node('div','hero-actions');actions.append(button(shared?'나도 16강 시작 →':'새 대진으로 다시 하기','primary','start'));if(!shared)actions.append(button('결과 공유하기 ↗','secondary','share'));section.append(actions);
      if(!shared && state){
        const bracket=replay(state);const journey=node('section','journey');journey.append(node('h2','','우승까지의 발자국'));const list=node('ol','journey-list');bracket.history.filter(m=>m.winner===winnerId).forEach(m=>{const li=node('li');li.append(node('span','journey-round',roundName(m.round)),node('span','loser',byId.get(m.loser).name+'와의 대결'),node('span','win','선택 ♡'));list.append(li);});journey.append(list);section.append(journey);
        const details=node('details','match-history');details.append(node('summary','','전체 대결 기록 · 15번의 선택'));bracket.history.forEach(m=>{const row=node('div','history-row');row.append(node('span','round',roundName(m.round)),node('span','pair',`${byId.get(m.a).name} vs ${byId.get(m.b).name}`),node('strong','',byId.get(m.winner).name));details.append(row);});section.append(details,button('↶ 결승 선택 다시 하기','text-button','undo'));
      }main.append(section);
    }
    async function share(){
      const id=main.querySelector('[data-winner]')?.dataset.winner;if(!byId.has(id))return;
      const url=new URL(window.location.href);url.hash=new URLSearchParams({winner:id,topic:topicFor(state)}).toString();
      const text=`[${topicFor(state)}]\n내 선택은 ${byId.get(id).name}! 🐹\n햄찌 월드컵 16강 도전!\n${url.href}`;
      if(navigator.share){try{await navigator.share({title:'햄찌 월드컵',text,url:url.href});return;}catch(error){if(error.name==='AbortError')return;}}
      try{if(!navigator.clipboard)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(text);announce('결과와 링크를 복사했어요. 친구에게 보내 주세요!');}
      catch{returnFocus=document.activeElement;document.getElementById('share-text').value=text;shareDialog.showModal();document.getElementById('share-text').select();}
    }
    main.addEventListener('click',event=>{
      const target=event.target.closest('button[data-action]');if(!target||target.disabled||locked)return;
      if(target.dataset.action==='pick' && event.detail>1)return;
      switch(target.dataset.action){case 'start':requestStart();break;case 'resume':if(!captureTopic())break;state.topic=draftTopic;save();clearSharedHash();renderGame();focusTitle();break;case 'last-result':renderResult(replay(state).champion,false);focusTitle();break;case 'home':renderHome();focusTitle();break;case 'pick':choose(target.dataset.id);break;case 'undo':undo();break;case 'share':share();break;}
    });
    document.getElementById('brand').addEventListener('click',()=>{if(locked)return;clearSharedHash();renderHome();focusTitle();});
    document.getElementById('cancel-restart').addEventListener('click',()=>restartDialog.close());
    document.getElementById('confirm-restart').addEventListener('click',()=>{restartDialog.close();start();});
    document.getElementById('close-share').addEventListener('click',()=>shareDialog.close());
    [restartDialog,shareDialog].forEach(dialog=>dialog.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});returnFocus=null;}));
    document.addEventListener('keydown',event=>{if(screen!=='game'||locked||event.repeat||restartDialog.open||shareDialog.open||event.altKey||event.ctrlKey||event.metaKey)return;if(['INPUT','TEXTAREA','SELECT'].includes(event.target.tagName))return;const side=event.key==='ArrowLeft'?0:event.key==='ArrowRight'?1:null;if(side!==null){event.preventDefault();const b=replay(state);choose(b.current[b.position+side]);}});
    main.addEventListener('input',event=>{if(event.target.id==='topic-input'){draftTopic=event.target.value;document.getElementById('topic-error').hidden=true;event.target.removeAttribute('aria-invalid');}});
    main.addEventListener('keydown',event=>{if(event.target.id==='topic-input'&&event.key==='Enter'&&!event.isComposing&&event.keyCode!==229&&!event.repeat){event.preventDefault();main.querySelector('.hero-actions button.primary')?.click();}});
    function sharedWinner(){const id=new URLSearchParams(window.location.hash.slice(1)).get('winner');return byId.has(id)?id:null;}
    function sharedTopic(){const topic=new URLSearchParams(window.location.hash.slice(1)).get('topic');return topic?.trim()?topic.trim().slice(0,60):DEFAULT_TOPIC;}
    load();draftTopic=topicFor(state);const shared=sharedWinner();if(shared)renderResult(shared,true);else if(state && replay(state).champion)renderResult(replay(state).champion,false);else renderHome();
    window.addEventListener('hashchange',()=>{const id=sharedWinner();if(id)renderResult(id,true);else if(screen==='result')renderHome();});
  })();
  </script>
</body>
